name: CI checks

on:
  pull_request:
  push:
    branches:
      - main
      - next

permissions:
  contents: read

jobs:
  download-srs:
    runs-on: ubuntu-latest
    outputs:
      srs-cache-hit: ${{ steps.cache-srs.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Restore SRS from cache
        id: restore-srs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: zk_stdlib/examples/assets/bls_filecoin_2p19
          key: fixed-srs-cache

      - name: Download SRS if not cached
        if: steps.restore-srs.outputs.cache-hit != 'true'
        run: |
          mkdir -p zk_stdlib/examples/assets
          curl -L -o zk_stdlib/examples/assets/bls_filecoin_2p19 \
            https://midnight-s3-fileshare-dev-eu-west-1.s3.eu-west-1.amazonaws.com/bls_filecoin_2p19

  feature-matrix:
    if: github.event.pull_request.draft == false
    name: Feature matrix (${{ matrix.name }})
    runs-on: ubuntu-latest

    # The host-only optimisations are off by default so wasm consumers neither
    # ship memmap2/tempfile nor can reach paths that need a filesystem. Each
    # combination is built and tested on its own: a feature that only ever
    # compiles alongside another is a feature whose own arm is untested.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            args: ""
          - name: mmap
            args: "--features mmap"
          - name: disk-spill
            args: "--features disk-spill"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/cargo-test
        with:
          package: midnight-proofs
          args: --lib ${{ matrix.args }}

  wasm-build:
    if: github.event.pull_request.draft == false
    name: Build for wasm32
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: rustup target add wasm32-unknown-unknown

      # Default features must build for wasm - the browser wallet is a
      # first-class consumer, and blst needs an LLVM clang with a wasm backend
      # to compile its C sources.
      - name: Build with default features
        run: cargo build -p midnight-proofs --lib --target wasm32-unknown-unknown

      # And a host-only feature on wasm must fail loudly at build time rather
      # than at runtime in someone's browser. This asserts the compile_error
      # fires; if it ever stops, the guard has silently stopped guarding.
      - name: A host-only feature on wasm must refuse to build
        run: |
          if cargo check -p midnight-proofs --lib --features mmap \
               --target wasm32-unknown-unknown 2>/dev/null; then
            echo "::error::--features mmap built for wasm32; the compile_error guard is not firing"
            exit 1
          fi
          echo "guard fired as expected"

  test-blstrs:
    if: github.event.pull_request.draft == false
    name: Test blstrs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/cargo-test
        with:
          package: midnight-curves
          args: --release --all-features

  test-circuits:
    if: github.event.pull_request.draft == false
    name: Test circuits
    runs-on: ubuntu-latest-16-core-x64

    env:
      RUST_BACKTRACE: full
      RUSTFLAGS: --cfg ci_build

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: cargo tree -e features -p midnight-curves
      - uses: ./.github/actions/cargo-test
        with:
          package: midnight-circuits
          args: --release

  test-zk-stdlib:
    needs: download-srs
    if: github.event.pull_request.draft == false
    name: Test zk-stdlib
    runs-on: ubuntu-latest-16-core-x64

    env:
      RUST_BACKTRACE: full
      RUSTFLAGS: --cfg ci_build

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Restore SRS from cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: zk_stdlib/examples/assets/bls_filecoin_2p19
          key: fixed-srs-cache

      - uses: ./.github/actions/cargo-test
        with:
          package: midnight-zk-stdlib
          args: --release -- --skip serialization
      - uses: ./.github/actions/cargo-test
        with:
          package: midnight-zk-stdlib
          args: --release --test serialization -- --test-threads=1

  test-vk-consistency:
    needs: download-srs
    if: github.event.pull_request.draft == false
    name: Test VK consistency
    runs-on: ubuntu-latest-16-core-x64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Restore SRS from cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: zk_stdlib/examples/assets/bls_filecoin_2p19
          key: fixed-srs-cache

      - uses: ./.github/actions/cargo-test
        with:
          package: midnight-zk-stdlib
          args: --release -- --ignored

      - name: Check for changes in goldenfiles/examples.
        run: |
          if ! git diff --quiet -- zk_stdlib/goldenfiles/examples; then
            echo "Files in zk_stdlib/goldenfiles/examples have changed"
            echo "Run "cargo test --release -- --ignored" locally and commit the changes"
            git diff -- zk_stdlib/goldenfiles/examples
            exit 1
          else
            echo "No changes in goldenfiles/examples"
          fi

  test-proofs:
    if: github.event.pull_request.draft == false
    name: Test proofs
    runs-on: ubuntu-latest
    steps:
      - name: Install libfontconfig1-dev
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/cargo-test
        with:
          package: midnight-proofs
          args: --release

  test-aggregation:
    if: github.event.pull_request.draft == false
    name: Test Aggregation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/cargo-test
        with:
          package: midnight-aggregation
          args: --release --all-features

  doc-links:
    if: github.event.pull_request.draft == false
    name: Intra-doc links
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: 'Install rust-toolchain.toml'
        run: rustup toolchain install
      - name: cargo fetch
        run: cargo fetch

      # Ensure intra-documentation links all resolve correctly
      # Requires #![deny(intra_doc_link_resolution_failure)] in crates.
      - name: Check intra-doc links
        run: cargo doc --workspace --document-private-items --no-deps

  fmt:
    if: github.event.pull_request.draft == false
    name: Rustfmt
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          toolchain: nightly
      - run: rustup component add rustfmt --toolchain nightly
      - run: cargo +nightly fmt --all -- --check

  clippy:
    if: github.event.pull_request.draft == false
    name: Clippy
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: 'Install rust-toolchain.toml'
        run: rustup toolchain install

      # font required for benchmarking charts generation
      - name: Install libfontconfig1-dev
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      - name: Run Clippy
        if: always()
        run: cargo clippy --all-targets --all-features -- -Dwarnings

      - name: Run Clippy on `aggregation`
        if: always()
        run: cargo clippy -p midnight-aggregation --all-targets --all-features -- -Dwarnings
